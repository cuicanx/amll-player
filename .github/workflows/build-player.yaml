name: 构建 AMLL Player Tauri 多端版本
on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
      - "packages/docs/**"
    # 正式版发布通道：推送形如 v1.0.0 的 tag 时触发，
    # 产出的安装包版本号就是 tag 上的版本号，且不是预发布。
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-pre-release:
    name: 删除预发布版本的构建产物
    runs-on: ubuntu-latest
    steps:
      - name: 删除预发布版本的构建产物
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ github.token }}
          assets: |
            *.*
          tag: ${{ github.ref_name }}-player-dev
          fail-if-no-assets: false
          fail-if-no-release: false

  build-release-desktop:
    name: 构建正式版 (Tauri 桌面版本)
    # Explicit token scope: tag-triggered runs must be able to create Releases.
    permissions:
      contents: write
    # 只在推送 v* tag 时运行，产出正式版安装包并发布为非预发布 Release。
    # 与上面的开发构建完全分离：开发构建始终是 `<branch>-player-dev`
    # 预发布且版本号带 commit 计数，正式版的版本号就是 tag 上的版本号。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: clean-pre-release
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PNPM
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          key: release-windows-x64
          cache-on-failure: true

      - name: 安装 wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.14.0"

      - name: 安装 pnpm 依赖
        run: |
          pnpm i --frozen-lockfile --ignore-scripts

      # version.json is the single source of truth for the stable version.
      # The tag must match it - otherwise someone tagged the wrong commit and
      # we would publish a bundle whose version does not match its release name.
      - name: 校验并设置正式版版本号
        shell: bash
        run: |
          node ./packages/player/scripts/sync-version.mjs --check
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          EXPECTED=$(node -p "require('./version.json').version")
          if [ "$TAG_VERSION" != "$EXPECTED" ]; then
            echo "ERROR: tag $TAG_VERSION does not match version.json ($EXPECTED)" >&2
            exit 1
          fi
          node ./packages/player/scripts/sync-version.mjs
          echo "Release version: $TAG_VERSION"

      - name: 构建并发布正式版
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: packages/player
          tagName: ${{ github.ref_name }}
          # Stable release ships ONE artifact for ONE platform: the Windows
          # NSIS installer. Dev channel keeps the full multi-platform matrix.
          args: --bundles nsis
          uploadUpdaterJson: true
          releaseName: AMLL Player ${{ github.ref_name }} 正式版
          # Keep release notes short and user-facing. Details live in
          # CHANGELOG.md; never paste commit hashes or "first release" lines
          # here - they repeat on every version and add no value.
          releaseBody: |
            ### 修复
            - 关闭程序后后台线程残留、多次启动内存持续升高的问题。
            - 歌单封面滚动动画在低歌曲数下抽搐闪烁的问题。
            - 在线搜歌平台标签不跟随语言、部分语言按钮文字重叠。
            - 安卓关于页更新一直报错（改用 GitHub Releases 检测并下载 APK）。
            - 歌单设置图标多余的悬停提示。
            - Windows 上点击安装插件、下载歌曲、从文件夹新建歌单时卡死的问题。
            - 设置页存储、在线音源、常规等页面在非中文下显示中文的问题。
            - 猫娘语与文言文中 {count}、{channel} 等显示为文字的问题。
            - 显示语言列表中出现两个「本地化 ID」的问题。
            - 关于页崩溃。
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  build-tauri-desktop:
    name: 构建 Tauri 桌面版本
    needs: clean-pre-release
    # Temporarily build ONLY Windows x64. The other four rows are kept below
    # verbatim as comments (not deleted). Uncomment them to restore those
    # platforms. Note: a job-level `if` cannot reference `matrix` in GitHub
    # Actions, so per-row gating has to be done by (un)commenting instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only Windows x64 is built while iterating - Linux/macOS builds are
          # disabled to keep each debug cycle short. Re-enable by uncommenting
          # the blocks below when doing a dedicated cross-platform release test.
          - platform: windows-latest
            args: ""
            name: windows
            arch: x86_64
            artifact_name_suffix: windows-x64
            package_extension: zip
            os_runner: windows-latest
          # - platform: ubuntu-latest
          #   args: ""
          #   name: linux
          #   arch: x86_64
          #   artifact_name_suffix: linux-x64
          #   package_extension: tar.gz
          #   os_runner: ubuntu-latest
          # - platform: windows-latest
          #   args: "--target aarch64-pc-windows-msvc"
          #   name: windows
          #   arch: aarch64
          #   artifact_name_suffix: windows-arm64
          #   package_extension: zip
          #   os_runner: windows-latest
          # - platform: macos-latest
          #   args: "--target aarch64-apple-darwin"
          #   name: macOS
          #   arch: aarch64
          #   artifact_name_suffix: macos-arm64
          #   package_extension: tar.gz
          #   os_runner: macos-15
          # - platform: macos-latest
          #   args: "--target x86_64-apple-darwin"
          #   name: macOS
          #   arch: x86_64
          #   artifact_name_suffix: macos-x64
          #   package_extension: tar.gz
          #   os_runner: macos-15

    runs-on: ${{ matrix.os_runner }}

    # CI-only build-speed tuning. The checked-in [profile.release]
    # (codegen-units = 1, full LTO) is kept untouched for local production
    # builds; these env overrides apply only to this dev prerelease job.
    # Full LTO with a single codegen unit is the slowest possible release
    # profile - 16 units + thin LTO cuts the link/LTO stage substantially
    # while producing the same Tauri bundle (exe/msi + updater signature).
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_NET_RETRY: "3"


    steps:
      - uses: actions/checkout@v7
        name: 克隆仓库
        with:
          fetch-depth: 0 # 为了正确生成开发版本号码

      # 固定 Xcode，避免镜像默认版本变动导致构建产物漂移
      - name: "macOS: 固定 Xcode 版本"
        uses: maxim-lobanov/setup-xcode@v1
        if: matrix.platform == 'macos-latest'
        with:
          xcode-version: "16.4"

      - name: 安装 PNPM
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: |
            wasm32-unknown-unknown,${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.platform == 'windows-latest' && matrix.arch == 'aarch64') && 'aarch64-pc-windows-msvc' || '' }}

      - name: 安装系统依赖 (仅 Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libappindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            curl \
            unzip \
            tar
            
      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          key: ${{ matrix.artifact_name_suffix }}
          # Keep the cache even when a later step fails or a run is cancelled,
          # so the next build does not pay for a cold Rust compile again.
          cache-on-failure: true

      # macOS 自带的 Xcode LLVM 不支持 WASM 目标
      - name: "macOS: 安装 LLVM 和 Clang"
        uses: KyleMayes/install-llvm-action@v2
        if: matrix.platform == 'macos-latest'
        with:
          version: "20"

      - name: "macOS: 设置环境变量"
        if: matrix.platform == 'macos-latest'
        run: |
          SDK_PATH=$(xcrun --show-sdk-path)
          echo "SDK Path: $SDK_PATH"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $SDK_PATH" >> $GITHUB_ENV
        shell: bash

      - name: 安装 wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.14.0"

      - name: 安装 pnpm 依赖
        run: |
          pnpm i --frozen-lockfile --ignore-scripts

      - name: 生成开发构建版本号
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export PATH="/usr/bin:$PATH"
          fi
          node ./packages/player/scripts/gen-dev-version.mjs

      - name: 构建 AMLL Player 程序并发布自动构建
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: packages/player
          tagName: ${{ github.ref_name }}-player-dev
          uploadUpdaterJson: true
          releaseName: AMLL Player ${{ github.ref_name }} 测试版
          # Dev builds: short, user-facing notes only. Raw commit messages and
          # duplicated bilingual boilerplate used to show up in the in-app
          # update panel; CHANGELOG.md is the single place for details.
          releaseBody: |
            ### 修复
            - 关闭程序后后台线程残留、多次启动内存持续升高的问题。
            - 歌单封面滚动动画在低歌曲数下抽搐闪烁的问题。
            - 在线搜歌平台标签不跟随语言、部分语言按钮文字重叠。
            - 安卓关于页更新一直报错（改用 GitHub Releases 检测并下载 APK）。
            - 歌单设置图标多余的悬停提示。
            - Windows 上点击安装插件、下载歌曲、从文件夹新建歌单时卡死的问题。
            - 设置页存储、在线音源、常规等页面在非中文下显示中文的问题。
            - 猫娘语与文言文中 {count}、{channel} 等显示为文字的问题。
            - 显示语言列表中出现两个「本地化 ID」的问题。
            - 关于页崩溃。
          prerelease: true
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 检查依赖锁定（Cargo.lock 无漂移）
        shell: bash
        run: |
          set -euo pipefail
          # Cargo may rewrite Cargo.lock during build (platform-specific deps,
          # rev URL normalization, etc). Git deps are pinned by rev in
          # Cargo.toml, so a diff is informational - warn, do not fail the
          # release over a lockfile format normalization.
          if ! git diff --exit-code -- Cargo.lock >/dev/null 2>&1; then
            echo "WARNING: Cargo.lock changed during build (review on next commit)." >&2
            git diff --stat -- Cargo.lock >&2 || true
          else
            echo "Cargo.lock unchanged, dependencies are reproducible."
          fi

      - name: 上传产物到 Action Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AMLL Player ${{matrix.name}}-${{matrix.arch}}
          path: |
            target/**/release/bundle/**/*
            target/**/release/amll-player.exe
            target/**/release/amll-player

  # Mirror manifest must be generated AFTER every desktop matrix job finished:
  # each platform uploads its own entry into the SAME latest.json via
  # tauri-action. Generating it inside the Windows job raced with the other
  # platforms and produced an incomplete/overwritten file. A dedicated job
  # with `needs` guarantees the final merged manifest is used.
  generate-mirror-manifest:
    name: 生成镜像更新清单
    # Wait for both channels' builds: dev (matrix desktop) is always needed;
    # release job is skipped on branch pushes but produces the stable manifest
    # on tag pushes. `always()` lets this job run when release is skipped.
    needs: [build-tauri-desktop, build-release-desktop]
    if: always() && needs.build-tauri-desktop.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 生成并上传镜像清单（开发通道）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}-player-dev
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" -p latest.json -D . --clobber
          REPO="$REPO" TAG="$TAG" node ./packages/player/scripts/gen-mirror-manifest.mjs
          gh release upload "$TAG" latest-mirror.json --repo "$REPO" --clobber

      - name: 生成并上传镜像清单（正式通道）
        if: startsWith(github.ref, 'refs/tags/v') && needs.build-release-desktop.result == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The stable release is published by build-release-desktop; wait for
          # its latest.json before generating the mirror manifest.
          for i in $(seq 1 30); do
            if gh release download "$TAG" --repo "$REPO" -p latest.json -D . --clobber 2>/dev/null; then
              break
            fi
            sleep 10
          done
          test -f latest.json || { echo "stable latest.json not found" >&2; exit 1; }
          REPO="$REPO" TAG="$TAG" node ./packages/player/scripts/gen-mirror-manifest.mjs
          gh release upload "$TAG" latest-mirror.json --repo "$REPO" --clobber

  build-tauri-android:
    name: 构建 Tauri 安卓版本
    needs: clean-pre-release
    # Signing material comes from repository secrets; the keystore file is
    # decoded into the runner at build time and is NEVER committed.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        name: 克隆仓库
        with:
          fetch-depth: 0 # 为了正确生成开发版本号码

      - name: 安装 PNPM
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu,x86_64-linux-android,aarch64-linux-android

      - name: 安装 wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: 安装 wasm32 目标
        run: rustup target add wasm32-unknown-unknown

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            packages/player/src-tauri -> target
          key: android

      - name: 设置编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib g++-multilib

      - name: 设置 Android SDK/NDK
        uses: android-actions/setup-android@v4

      - name: 安装 NDK
        run: sdkmanager --install "ndk;27.2.12479018"
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          
      - name: 安装 pnpm 依赖
        run: |
          pnpm i --frozen-lockfile --ignore-scripts

      - name: 生成开发构建版本号
        run: |
          node ./packages/player/scripts/gen-dev-version.mjs

      - name: 配置 Android 签名
        shell: bash
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE:-}" ]; then
            echo "ERROR: Android signing secrets are missing" >&2
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/amll-release.jks"
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$KEYSTORE_FILE"
          cd packages/player/src-tauri/gen/android
          printf 'password=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$KEYSTORE_FILE" \
            > keystore.properties
          echo "Android signing configured (alias: $ANDROID_KEY_ALIAS)"

      - name: 构建 AMLL Player 安卓版本
        env:
          CARGO_NDK_ANDROID_PLATFORM: 26
        run: |
          set -euo pipefail
          export NDK_HOME=$ANDROID_NDK_HOME
          export JAVA_HOME=$JAVA_HOME_17_X64
          # ffmpeg_audio_sys uses bindgen; without an explicit NDK sysroot it
          # picks up host /usr/include and fails on __float128 for aarch64.
          # Cargo may pick a different NDK than $ANDROID_NDK_HOME (the runner
          # preinstalls several). Find the sysroot from the clang cargo will use.
          NDK_SYSROOT=""
          for candidate in "$ANDROID_NDK_HOME" /usr/local/lib/android/sdk/ndk/*; do
            if [ -d "$candidate/toolchains/llvm/prebuilt/linux-x86_64/sysroot" ]; then
              NDK_SYSROOT="$candidate/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
              break
            fi
          done
          if [ -n "$NDK_SYSROOT" ]; then
            echo "Using NDK sysroot: $NDK_SYSROOT"
            export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$NDK_SYSROOT"
            export BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--sysroot=$NDK_SYSROOT"
          else
            echo "WARNING: no NDK sysroot found; bindgen may use host headers" >&2
          fi
          # Git deps are pinned by rev in Cargo.toml; the committed Cargo.lock
          # is authoritative. A lockfile drift check runs in the desktop job.
          pnpm -F player tauri android build --target aarch64 --target x86_64 --split-per-abi

      - name: 整理并重命名 Android 构建包
        run: |
          VERSION=$(node -p "require('./packages/player/src-tauri/tauri.conf.json').version")
          echo "Version is $VERSION"
          mkdir -p build-dist
          find packages/player/src-tauri/gen/android/app/build/outputs -name "*.apk" | while read -r apk; do
            filename=$(basename "$apk")
            if [[ "$filename" == *"arm64-v8a"* ]]; then
              new_name="AMLL.Player-${VERSION}.arm64-release.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              new_name="AMLL.Player-${VERSION}.x86_64-release.apk"
            elif [[ "$filename" == *"universal"* ]]; then
              new_name="AMLL.Player-${VERSION}.universal-release.apk"
            else
              new_name="AMLL.Player-${VERSION}.${filename}"
            fi
            cp "$apk" "build-dist/$new_name"
            echo "Copied $apk to build-dist/$new_name"
          done
          find packages/player/src-tauri/gen/android/app/build/outputs -name "*.aab" | while read -r aab; do
            cp "$aab" "build-dist/AMLL.Player-${VERSION}-release.aab"
            echo "Copied $aab to build-dist/AMLL.Player-${VERSION}-release.aab"
          done

      - name: 上传产物到 Action Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AMLL Player Android Universal
          path: build-dist/*

      - name: 发布 Android 安装包至 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}-player-dev
        run: |
          set -euo pipefail
          # action-gh-release resolves the Release against the branch ref on
          # push events and fails with "not accessible by integration".
          # gh CLI uploads directly to the tag, which the desktop job created.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --prerelease \
              --title "AMLL Player $TAG 测试版" --notes "Android 测试构建" || true
          fi
          gh release upload "$TAG" build-dist/* --repo "$REPO" --clobber
          echo "Android artifacts uploaded to $TAG"

  # Attach the mobile installers to the STABLE release. This is a separate
  # job with explicit needs: doing it inside the Android job raced the desktop
  # release job (which creates the Release much later) and timed out.
  attach-android-to-stable:
    name: 正式版附加 Android 安装包
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-release-desktop, build-tauri-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AMLL Player Android Universal
          path: android-dist
      - name: 上传 APK 到正式版
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only APKs - the AAB is for Play Store and useless to sideloaders.
          find android-dist -name '*.apk' -print0 | xargs -0 -r gh release upload "$TAG" --repo "$REPO" --clobber
          echo "Android APKs attached to stable release $TAG"

  build-tauri-ios:
    name: 构建 Tauri iOS 版本
    needs: clean-pre-release
    # iOS is DISABLED by project decision (2026-11-27). Do not enable.
    # The steps below produce an UNSIGNED .ipa that no normal device can
    # install; enabling without a full signing + TestFlight pipeline would
    # only waste CI time and publish unusable artifacts. Kept for reference.
    if: false
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
        name: 克隆仓库
        with:
          fetch-depth: 0

      # 不要升级到 Xcode 26：其移除了 libswiftCompatibility 5.x，
      # 会导致 Tauri iOS 构建链接失败（tauri-apps/tauri#15066）。
      # macos-15 镜像默认即为 Xcode 16.4。
      - name: 选择 Xcode 16.4 版本
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: 安装 PNPM
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链与 iOS 构建目标
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: "aarch64-apple-ios"

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            packages/player/src-tauri -> target
          key: ios-aarch64-only
    
      - name: 安装 pnpm 依赖
        run: |
          pnpm i --frozen-lockfile --ignore-scripts

      - name: 生成开发构建版本号
        run: |
          node ./packages/player/scripts/gen-dev-version.mjs
        env:
          AMLL_IOS_BUILD: "true"

      - name: 动态注入 iOS 构建版本号至 Info.plist
        shell: bash
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          PLIST_PATH="packages/player/src-tauri/gen/apple/amll-player_iOS/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $COMMIT_COUNT" "$PLIST_PATH"
          echo "Successfully synced CFBundleVersion to $COMMIT_COUNT in Info.plist"

      - name: 构建 iOS 应用并生成无签名版 .ipa
        shell: bash
        run: |
          # 1. 尝试使用 Tauri CLI 编译 iOS 应用
          # 即使无签名构建在导出归档时可能因为没有证书报错（如 code 70），
          # 只要底层的编译产物 .app 成功生成，就可以继续打包为 ipa。
          pnpm -F player tauri ios build || echo "Tauri CLI exited with warning/error. Checking if .app was generated..."

          # 2. 动态定位编译生成的 .app 目录
          APP_PATH=$(find packages/player/src-tauri/gen/apple -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData $HOME/Library/Developer/Xcode/Archives -name "*.app" 2>/dev/null | head -1)
          fi

          # 3. 校验并打包为无签名 .ipa
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Successfully found compiled .app at: $APP_PATH"
            VERSION=$(node -p "require('./packages/player/src-tauri/tauri.conf.json').version")
            COMMIT_COUNT=$(git rev-list --count HEAD)
            IPA_NAME="AMLL.Player-${VERSION}+${COMMIT_COUNT}.arm64-release-unsigned.ipa"
            
            mkdir -p build/Payload
            cp -r "$APP_PATH" build/Payload/
            cd build && zip -r "../$IPA_NAME" Payload
            echo "IPA successfully created: $IPA_NAME"
          else
            echo "ERROR: Compiled .app not found. Build failed."
            exit 1
          fi

      - name: 上传无签名 ipa 包至 GitHub Action Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AMLL Player iOS Unsigned IPA
          path: "*.ipa"

      - name: 发布 iOS 安装包至 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}-player-dev
          prerelease: true
          files: "*.ipa"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
