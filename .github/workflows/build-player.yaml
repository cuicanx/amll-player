name: 构建 AMLL Player Tauri 多端版本
on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
      - "packages/docs/**"
    # 正式版发布通道：推送形如 v1.0.0 的 tag 时触发，
    # 产出的安装包版本号就是 tag 上的版本号，且不是预发布。
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-pre-release:
    name: 删除预发布版本的构建产物
    runs-on: ubuntu-latest
    steps:
      - name: 删除预发布版本的构建产物
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ github.token }}
          assets: |
            *.*
          tag: ${{ github.ref_name }}-player-dev
          fail-if-no-assets: false
          fail-if-no-release: false

  build-release-desktop:
    name: 构建正式版 (Tauri 桌面版本)
    # 只在推送 v* tag 时运行，产出正式版安装包并发布为非预发布 Release。
    # 与上面的开发构建完全分离：开发构建始终是 `<branch>-player-dev`
    # 预发布且版本号带 commit 计数，正式版的版本号就是 tag 上的版本号。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: clean-pre-release
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PNPM
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          key: release-windows-x64
          cache-on-failure: true

      - name: 安装 wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.14.0"

      - name: 安装 pnpm 依赖
        run: |
          pnpm i --frozen-lockfile --ignore-scripts

      # 正式版的版本号直接来自 tag（v1.0.0 -> 1.0.0），
      # 不能再走 gen-dev-version.mjs，否则会被改写成 1.0.<commitCount>。
      - name: 设置正式版版本号
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Release version: $VERSION"
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            const confPath = "packages/player/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(confPath, "utf-8"));
            conf.version = version;
            fs.writeFileSync(confPath, JSON.stringify(conf, null, "\t"));
            console.log("tauri.conf.json version ->", conf.version);
          ' "$VERSION"

      - name: 构建并发布正式版
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: packages/player
          tagName: ${{ github.ref_name }}
          uploadUpdaterJson: true
          releaseName: AMLL Player ${{ github.ref_name }} 正式版
          releaseBody: |
            ## AMLL Player ${{ github.ref_name }} 正式版

            > 首个正式发布版本。

            ### 崩溃修复

            - 歌词偏移量导致的白屏崩溃（代码层根治）：偏移此前只作用于行起始时间而未同步结束时间，
              AMLL 歌词引擎会因 `startTime > endTime` 抛出 `RangeError` 直接崩溃。
              现已补齐行级 `endTime` 偏移，并新增时间戳净化兜底（逐行、逐单词、逐注音校验）。

            ### 主译互换改为纯显示层

            - 删除「翻译歌词数据」编辑框，仅保留一个按钮，放在歌词偏移旁边。
            - 点击只在播放时调换主歌词与翻译歌词的主次顺序，不修改任何歌词数据。

            ### 新增功能

            - 存储空间新增「自动清除在线歌曲缓存」：多档位可选（含不清理），默认 3 天。
            - 新用户默认在线模式（不影响已有用户设置）。
            - 在线搜索按钮固定在搜索框右侧。
            - 平台分区栏仅在有搜索结果时显示。
            - 在线搜索结果右键菜单新增「下载」，可自由选择保存位置。

            ---

            本版本对应源码提交 `${{ github.sha }}`。
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  build-tauri-desktop:
    name: 构建 Tauri 桌面版本
    needs: clean-pre-release
    # Temporarily build ONLY Windows x64. The other four rows are kept below
    # verbatim as comments (not deleted). Uncomment them to restore those
    # platforms. Note: a job-level `if` cannot reference `matrix` in GitHub
    # Actions, so per-row gating has to be done by (un)commenting instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            name: windows
            arch: x86_64
            artifact_name_suffix: windows-x64
            package_extension: zip
            os_runner: windows-latest
          # - platform: ubuntu-latest
          #   args: ""
          #   name: linux
          #   arch: x86_64
          #   artifact_name_suffix: linux-x64
          #   package_extension: tar.gz
          #   os_runner: ubuntu-latest
          # - platform: windows-latest
          #   args: "--target aarch64-pc-windows-msvc"
          #   name: windows
          #   arch: aarch64
          #   artifact_name_suffix: windows-arm64
          #   package_extension: zip
          #   os_runner: windows-latest
          # - platform: macos-latest
          #   args: "--target aarch64-apple-darwin"
          #   name: macOS
          #   arch: aarch64
          #   artifact_name_suffix: macos-arm64
          #   package_extension: tar.gz
          #   os_runner: macos-15
          # - platform: macos-latest
          #   args: "--target x86_64-apple-darwin"
          #   name: macOS
          #   arch: x86_64
          #   artifact_name_suffix: macos-x64
          #   package_extension: tar.gz
          #   os_runner: macos-15

    runs-on: ${{ matrix.os_runner }}

    # CI-only build-speed tuning. The checked-in [profile.release]
    # (codegen-units = 1, full LTO) is kept untouched for local production
    # builds; these env overrides apply only to this dev prerelease job.
    # Full LTO with a single codegen unit is the slowest possible release
    # profile - 16 units + thin LTO cuts the link/LTO stage substantially
    # while producing the same Tauri bundle (exe/msi + updater signature).
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_NET_RETRY: "3"


    steps:
      - uses: actions/checkout@v7
        name: 克隆仓库
        with:
          fetch-depth: 0 # 为了正确生成开发版本号码

      # 固定 Xcode，避免镜像默认版本变动导致构建产物漂移
      - name: "macOS: 固定 Xcode 版本"
        uses: maxim-lobanov/setup-xcode@v1
        if: matrix.platform == 'macos-latest'
        with:
          xcode-version: "16.4"

      - name: 安装 PNPM
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: |
            wasm32-unknown-unknown,${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || (matrix.platform == 'windows-latest' && matrix.arch == 'aarch64') && 'aarch64-pc-windows-msvc' || '' }}

      - name: 安装系统依赖 (仅 Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libappindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            curl \
            unzip \
            tar
            
      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          key: ${{ matrix.artifact_name_suffix }}
          # Keep the cache even when a later step fails or a run is cancelled,
          # so the next build does not pay for a cold Rust compile again.
          cache-on-failure: true

      # macOS 自带的 Xcode LLVM 不支持 WASM 目标
      - name: "macOS: 安装 LLVM 和 Clang"
        uses: KyleMayes/install-llvm-action@v2
        if: matrix.platform == 'macos-latest'
        with:
          version: "20"

      - name: "macOS: 设置环境变量"
        if: matrix.platform == 'macos-latest'
        run: |
          SDK_PATH=$(xcrun --show-sdk-path)
          echo "SDK Path: $SDK_PATH"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $SDK_PATH" >> $GITHUB_ENV
        shell: bash

      - name: 安装 wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.14.0"

      - name: 安装 pnpm 依赖
        run: |
          pnpm i --frozen-lockfile --ignore-scripts

      - name: 生成开发构建版本号
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export PATH="/usr/bin:$PATH"
          fi
          node ./packages/player/scripts/gen-dev-version.mjs

      - name: 构建 AMLL Player 程序并发布自动构建
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: packages/player
          tagName: ${{ github.ref_name }}-player-dev
          uploadUpdaterJson: true
          releaseName: AMLL Player ${{ github.ref_name }} branch development build
          # Structured markdown: the in-app update panel renders headings,
          # bullets, bold and inline code, so notes need real hierarchy instead
          # of one run-on block of text.
          releaseBody: |
            ## 更新内容

            > 本构建来自 `${{ github.ref_name }}` 分支的自动构建，可能不稳定，建议仅用于测试。

            ### 本次变更

            ${{ github.event.head_commit.message }}

            ---

            ## What's new

            Automated build of the `${{ github.ref_name }}` branch. Development builds may be unstable; use them for testing only.
            Installers are signed; automatic updates from `0.0.1144` onward work without a manual reinstall.
          prerelease: true
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 官方 latest.json 里的 download url 是 api.github.com 的 asset 接口，
      # 会 302 到 release-assets.githubusercontent.com。该域名在部分网络与
      # VPN 分流规则下不可达，表现就是"能查到更新、点下载必然失败"。
      # 这里另存一份把 url 换成 gh-proxy 直链的清单，供更新器优先使用。
      - name: 生成镜像更新清单
        if: matrix.artifact_name_suffix == 'windows-x64'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}-player-dev
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" -p latest.json -D . --clobber
          node -e '
          const fs = require("node:fs");
          const { execSync } = require("node:child_process");
          const repo = process.env.REPO, tag = process.env.TAG;
          const rel = JSON.parse(execSync(`gh release view ${tag} --repo ${repo} --json assets`).toString());
          const src = JSON.parse(fs.readFileSync("latest.json", "utf8"));
          const base = `https://gh-proxy.com/https://github.com/${repo}/releases/download/${tag}/`;
          // Each platform carries its OWN signature. Pointing every platform at
          // the .msi made windows-x86_64-nsis (setup.exe) verify the exe signature
          // against msi bytes -> "更新校验失败". Resolve the matching asset per
          // platform via the asset id in the official URL so signature and bytes
          // always describe the same file.
          const byId = new Map((rel.assets || []).map((a) => [String(a.id), a.name]));
          const rewritten = [];
          for (const [key, platform] of Object.entries(src.platforms || {})) {
            const idMatch = /(?:\\/|%2F)assets\\/(\\d+)/.exec(platform.url || "");
            const name = idMatch ? byId.get(idMatch[1]) : undefined;
            if (name) {
              platform.url = base + encodeURIComponent(name);
              rewritten.push(`${key} -> ${name}`);
            }
          }
          if (rewritten.length === 0) {
            throw new Error("无法解析任何平台的资产名，拒绝生成错误的镜像清单");
          }
          src.notes = (src.notes || "") + "\n\n（镜像下载地址：国内网络无需 VPN）";
          fs.writeFileSync("latest-mirror.json", JSON.stringify(src, null, 2));
          console.log("latest-mirror.json 已重写:\n" + rewritten.join("\n"));
          '
          gh release upload "$TAG" latest-mirror.json --repo "$REPO" --clobber

      - name: 上传产物到 Action Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AMLL Player ${{matrix.name}}-${{matrix.arch}}
          path: |
            target/**/release/bundle/**/*
            target/**/release/amll-player.exe
            target/**/release/amll-player

  build-tauri-android:
    name: 构建 Tauri 安卓版本
    needs: clean-pre-release
    # Temporarily disabled: only Windows x64 is built. Remove this line to restore.
    if: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        name: 克隆仓库
        with:
          fetch-depth: 0 # 为了正确生成开发版本号码

      - name: 安装 PNPM
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu,x86_64-linux-android,aarch64-linux-android

      - name: 安装 wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: 安装 wasm32 目标
        run: rustup target add wasm32-unknown-unknown

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            packages/player/src-tauri -> target
          key: android

      - name: 设置编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib g++-multilib

      - name: 设置 Android SDK/NDK
        uses: android-actions/setup-android@v4

      - name: 安装 NDK
        run: sdkmanager --install "ndk;27.2.12479018"
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          
      - name: 安装 pnpm 依赖
        run: |
          pnpm i --frozen-lockfile --ignore-scripts

      - name: 生成开发构建版本号
        run: |
          node ./packages/player/scripts/gen-dev-version.mjs

      - name: 构建 AMLL Player 安卓版本
        env:
          CARGO_NDK_ANDROID_PLATFORM: 26
        run: |
          export NDK_HOME=$ANDROID_NDK_HOME
          export JAVA_HOME=$JAVA_HOME_17_X64
          pnpm -F player tauri android build --target aarch64 --target x86_64 --split-per-abi

      - name: 整理并重命名 Android 构建包
        run: |
          VERSION=$(node -p "require('./packages/player/src-tauri/tauri.conf.json').version")
          echo "Version is $VERSION"
          mkdir -p build-dist
          find packages/player/src-tauri/gen/android/app/build/outputs -name "*.apk" | while read -r apk; do
            filename=$(basename "$apk")
            if [[ "$filename" == *"arm64-v8a"* ]]; then
              new_name="AMLL.Player-${VERSION}.arm64-release-unsigned.apk"
            elif [[ "$filename" == *"x86_64"* ]]; then
              new_name="AMLL.Player-${VERSION}.x86_64-release-unsigned.apk"
            elif [[ "$filename" == *"universal"* ]]; then
              new_name="AMLL.Player-${VERSION}.universal-release-unsigned.apk"
            else
              new_name="AMLL.Player-${VERSION}.${filename}"
            fi
            cp "$apk" "build-dist/$new_name"
            echo "Copied $apk to build-dist/$new_name"
          done
          find packages/player/src-tauri/gen/android/app/build/outputs -name "*.aab" | while read -r aab; do
            cp "$aab" "build-dist/AMLL.Player-${VERSION}-release.aab"
            echo "Copied $aab to build-dist/AMLL.Player-${VERSION}-release.aab"
          done

      - name: 上传产物到 Action Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AMLL Player Android Universal
          path: build-dist/*

      - name: 发布 Android 安装包至 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}-player-dev
          prerelease: true
          files: build-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri-ios:
    name: 构建 Tauri iOS 版本
    needs: clean-pre-release
    # Temporarily disabled: only Windows x64 is built. Remove this line to restore.
    if: false
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
        name: 克隆仓库
        with:
          fetch-depth: 0

      # 不要升级到 Xcode 26：其移除了 libswiftCompatibility 5.x，
      # 会导致 Tauri iOS 构建链接失败（tauri-apps/tauri#15066）。
      # macos-15 镜像默认即为 Xcode 16.4。
      - name: 选择 Xcode 16.4 版本
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: 安装 PNPM
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: 安装 Rust 工具链与 iOS 构建目标
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: "aarch64-apple-ios"

      - name: 配置 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            packages/player/src-tauri -> target
          key: ios-aarch64-only
    
      - name: 安装 pnpm 依赖
        run: |
          pnpm i --frozen-lockfile --ignore-scripts

      - name: 生成开发构建版本号
        run: |
          node ./packages/player/scripts/gen-dev-version.mjs
        env:
          AMLL_IOS_BUILD: "true"

      - name: 动态注入 iOS 构建版本号至 Info.plist
        shell: bash
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          PLIST_PATH="packages/player/src-tauri/gen/apple/amll-player_iOS/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $COMMIT_COUNT" "$PLIST_PATH"
          echo "Successfully synced CFBundleVersion to $COMMIT_COUNT in Info.plist"

      - name: 构建 iOS 应用并生成无签名版 .ipa
        shell: bash
        run: |
          # 1. 尝试使用 Tauri CLI 编译 iOS 应用
          # 即使无签名构建在导出归档时可能因为没有证书报错（如 code 70），
          # 只要底层的编译产物 .app 成功生成，就可以继续打包为 ipa。
          pnpm -F player tauri ios build || echo "Tauri CLI exited with warning/error. Checking if .app was generated..."

          # 2. 动态定位编译生成的 .app 目录
          APP_PATH=$(find packages/player/src-tauri/gen/apple -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData $HOME/Library/Developer/Xcode/Archives -name "*.app" 2>/dev/null | head -1)
          fi

          # 3. 校验并打包为无签名 .ipa
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Successfully found compiled .app at: $APP_PATH"
            VERSION=$(node -p "require('./packages/player/src-tauri/tauri.conf.json').version")
            COMMIT_COUNT=$(git rev-list --count HEAD)
            IPA_NAME="AMLL.Player-${VERSION}+${COMMIT_COUNT}.arm64-release-unsigned.ipa"
            
            mkdir -p build/Payload
            cp -r "$APP_PATH" build/Payload/
            cd build && zip -r "../$IPA_NAME" Payload
            echo "IPA successfully created: $IPA_NAME"
          else
            echo "ERROR: Compiled .app not found. Build failed."
            exit 1
          fi

      - name: 上传无签名 ipa 包至 GitHub Action Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AMLL Player iOS Unsigned IPA
          path: "*.ipa"

      - name: 发布 iOS 安装包至 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}-player-dev
          prerelease: true
          files: "*.ipa"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
